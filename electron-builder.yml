appId: com.harshalslimaye.mcpflo
productName: MCPFlo
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: mcpflo
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
  target:
    - target: dmg
      arch: arm64
    # electron-updater on macOS downloads and applies the zip; the dmg is
    # only the human-download artifact on the releases page.
    - target: zip
      arch: arm64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
# Read at build time to upload artifacts + latest-mac.yml/latest.yml to a
# draft GitHub release, and baked into the app (app-update.yml) so
# electron-updater knows where to check at runtime. Publishing the draft
# release is the "go live" switch for updates.
publish:
  provider: github
  owner: harshalslimaye
  repo: mcpflo
